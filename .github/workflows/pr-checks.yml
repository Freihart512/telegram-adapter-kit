name: PR checks

on:
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format, lint, typecheck, coverage, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          node -e "const fs=require('node:fs');const p='coverage/coverage-summary.json';if(!fs.existsSync(p)){console.log('coverage-summary.json not found');process.exit(0)};const s=JSON.parse(fs.readFileSync(p,'utf8')).total;const pct=(v)=>typeof v==='number'?v.toFixed(2):'n/a';const md=['## Coverage summary','',`- Lines: ${pct(s.lines?.pct)}%`,`- Branches: ${pct(s.branches?.pct)}%`,`- Functions: ${pct(s.functions?.pct)}%`,`- Statements: ${pct(s.statements?.pct)}%`,'',`Thresholds: lines >= 80, branches >= 80, functions >= 80, statements >= 80`].join('\n');fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + '\n');console.log(md);"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

      - name: Build
        run: npm run build

      - name: Verify distributables
        run: npm run verify:dist
